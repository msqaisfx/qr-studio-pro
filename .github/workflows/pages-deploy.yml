name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build repository subpath
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify the deployed public beta
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set +e
          node scripts/verify-public-beta.mjs https://msqaisfx.github.io/qr-studio-pro/ 2>&1 | tee public-beta-verification.log
          status=${PIPESTATUS[0]}
          {
            echo '## Public beta verification log'
            echo '```text'
            cat public-beta-verification.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
