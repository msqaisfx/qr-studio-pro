name: Feature request
description: Suggest a scoped improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and offline impact
      description: Explain whether the proposal needs network access, remote storage, or new permissions.
    validations:
      required: true
